version: '3.8'

services:
  rpm-realtime-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.realtime-gateway
    container_name: rpm-realtime-gateway
    restart: always
    ports:
      - "9191:9191"
    environment:
      - PORT=9191
      - REALTIME_API_BASE_URL=${REALTIME_API_BASE_URL}
      - REALTIME_GATEWAY_SHARED_SECRET=${REALTIME_GATEWAY_SHARED_SECRET}
      - REALTIME_DATABASE_CONNECTION_STRING=${REALTIME_DATABASE_CONNECTION_STRING}

  rpm-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    container_name: rpm-relay-server
    restart: always
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
    volumes:
      - ./updates:/app/updates:ro

